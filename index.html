<style>
  #cmyk-background {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    z-index: -1;
    background-color: #FFFFFF; /* The transition color */
  }
  .color-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    transition: opacity 0.05s linear; /* Updated to 0.05s flash */
  }
  .color-layer.active {
    opacity: 1;
  }
</style>

<div id="cmyk-background">
  <div id="layer-cyan" class="color-layer" style="background-color: #00FFFF;"></div>
  <div id="layer-magenta" class="color-layer" style="background-color: #FF00FF;"></div>
  <div id="layer-yellow" class="color-layer" style="background-color: #FFFF00;"></div>
  <div id="layer-black" class="color-layer" style="background-color: #000000;"></div>
</div>

<script>
  (function() {
    const layers = [
      { id: 'layer-cyan', duration: 2000 },    /* Updated to 2000ms */
      { id: 'layer-magenta', duration: 2000 },
      { id: 'layer-yellow', duration: 2000 },
      { id: 'layer-black', duration: 2000 }
    ];
    
    let currentIndex = 0;

    function rotateColor() {
      // Hide all layers to reveal the white background
      layers.forEach(l => document.getElementById(l.id).classList.remove('active'));
      
      // Wait 50ms for the "flash" to white
      setTimeout(() => {
        const current = layers[currentIndex];
        document.getElementById(current.id).classList.add('active');
        
        currentIndex = (currentIndex + 1) % layers.length;
        
        // Schedule next rotation
        setTimeout(rotateColor, current.duration);
      }, 50); // Matches the 0.05s transition
    }

    rotateColor();
  })();
</script>
